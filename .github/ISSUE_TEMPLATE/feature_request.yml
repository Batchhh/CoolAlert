name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your app where CoolAlert falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to write?
      description: Sketch the API you'd like to use.
      render: swift
      placeholder: |
        CoolAlert(.info, "Hello")
            .something()
            .show()
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself
